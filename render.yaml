services:
  - type: web
    name: docurag
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m rag.embeddings
    # One worker: the FAISS index lives in process memory and must be shared.
    # Threads allow polling upload progress while a PDF is being embedded.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: TOP_K
        value: "5"
      - key: MIN_SIMILARITY
        value: "0.25"
      - key: MAX_UPLOAD_MB
        value: "50"
